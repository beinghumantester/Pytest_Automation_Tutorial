[pytest]

# ==========================================================
#                 PYTEST CONFIGURATION
# ==========================================================

# Add the project root directory to Python's module search path.
# This allows imports like:
# from pages.login_page import LoginPage
pythonpath = .

# Directory where Pytest will search for test files.
testpaths = tests

# Naming convention for test files.
python_files = test_*.py

# Naming convention for test classes.
python_classes = Test*

# Naming convention for test methods/functions.
python_functions = test_*

# Default command-line options.
# -v : Verbose output
# -s : Show print() statements in the console
addopts = -v -s


# ==========================================================
#               USEFUL PYTEST COMMANDS
# ==========================================================

# Run all tests
# pytest

# Run all tests with verbose output
# pytest -v

# Show print() statements
# pytest -s

# Verbose output + print() statements
# pytest -v -s

# Run a specific test file
# pytest tests/test_login.py

# Run a specific test function
# pytest tests/test_login.py::test_valid_login

# Run tests matching a keyword
# pytest -k login

# Run tests with a specific marker
# pytest -m smoke
# pytest -m regression

# Stop execution after the first failure
# pytest -x

# Re-run only the tests that failed in the previous execution
# pytest --lf

# Run tests in parallel (requires pytest-xdist)
# pytest -n 2

# Collect tests without executing them
# pytest --collect-only

# Show local variables in tracebacks
# pytest -l

# Display extra summary information for skipped, failed, etc.
# pytest -ra

# Run tests with a custom traceback format
# pytest --tb=short


# ==========================================================
#                  HTML REPORTS
# ==========================================================

# Generate an HTML report
# pytest --html=reports/report.html

# Generate a standalone HTML report
# pytest --html=reports/report.html --self-contained-html


# ==========================================================
#                  ALLURE REPORTS
# ==========================================================

# Generate Allure result files
# pytest --alluredir=reports/allure-results

# Generate a static Allure report
# allure generate reports/allure-results -o reports/allure-report --clean

# Open an existing Allure report
# allure open reports/allure-report

# Generate and serve the report in one command
# allure serve reports/allure-results


# ==========================================================
#                  DEBUGGING TIPS
# ==========================================================

# If Pytest says:
# collected 0 items
# Check:
# 1. testpaths
# 2. python_files naming
# 3. test_functions naming
# 4. Import errors

# If you see:
# ModuleNotFoundError
# Verify:
# - pythonpath = .
# - Correct import statements
# - Project structure

# Check the project root detected by Pytest
# pytest --version
# pytest --collect-only